name: Procurement CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-update1.yml"

permissions:
  contents: read

concurrency:
  group: procurement-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-corpus-rate-refresh' || github.ref == 'refs/heads/feature/candidate-clustering') && ' + APK' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK and Gradle environment
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"

          # GitHub Android runners normally already carry these packages.
          # Only touch sdkmanager when a required package is actually missing.
          if [ ! -d "$SDK_ROOT/platforms/android-35" ] || [ ! -d "$SDK_ROOT/build-tools/36.1.0" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
            if [ -z "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager || true)"
            fi
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.1.0"
          fi

          sed -i '/^android\.sdk\.path=/d' gradle.properties
          sed -i '/^systemProp\.java\.library\.path=/d' gradle.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew

      - name: Run app unit tests
        id: unit_tests
        shell: bash
        run: |
          mkdir -p build-artifacts
          set -o pipefail
          bash gradlew :app:testDebugUnitTest --stacktrace --no-daemon --build-cache 2>&1 | tee build-artifacts/unit-test-console.log

      - name: Verify signing keystore exists
        id: keystore
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-corpus-rate-refresh' || github.ref == 'refs/heads/feature/candidate-clustering')
        shell: bash
        run: |
          test -f keystore/debug.keystore
          keytool -list \
            -keystore keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null

      - name: Build debug APK
        id: apk_build
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-corpus-rate-refresh' || github.ref == 'refs/heads/feature/candidate-clustering')
        shell: bash
        run: bash gradlew :app:assembleDebug --stacktrace --no-daemon --build-cache

      - name: Record APK checksums and signing certificate
        id: apk_identity
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-corpus-rate-refresh' || github.ref == 'refs/heads/feature/candidate-clustering')
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p build-artifacts
          cp "$APK" build-artifacts/Procurement-debug.apk
          sha256sum "$APK" | tee build-artifacts/APK_SHA256.txt

          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner"
          fi
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee build-artifacts/APK_SIGNING_CERT.txt

      - name: Upload APK
        id: apk_upload
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-corpus-rate-refresh' || github.ref == 'refs/heads/feature/candidate-clustering')
        uses: actions/upload-artifact@v4
        with:
          name: Procurement-APK
          path: |
            build-artifacts/Procurement-debug.apk
            build-artifacts/APK_SHA256.txt
            build-artifacts/APK_SIGNING_CERT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Procurement-Test-Reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Single-run acceptance summary. Never conceal a failing gate or print secrets.
      - name: Publish delivery and failure summary
        if: always()
        env:
          TEST_RESULT: ${{ steps.unit_tests.outcome }}
          KEYSTORE_RESULT: ${{ steps.keystore.outcome }}
          BUILD_RESULT: ${{ steps.apk_build.outcome }}
          IDENTITY_RESULT: ${{ steps.apk_identity.outcome }}
          UPLOAD_RESULT: ${{ steps.apk_upload.outcome }}
        shell: bash
        run: |
          {
            echo "## Procurement CI delivery"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: [#$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Unit tests / compilation: **$TEST_RESULT**"
            if [ "$TEST_RESULT" = "failure" ] && [ -f build-artifacts/unit-test-console.log ]; then
              echo ""
              echo "### Failure hints (unit tests / Kotlin)"
              echo '~~~text'
              grep -E '^e: |^> Task .* FAILED|^Execution failed for task|^There were failing tests' build-artifacts/unit-test-console.log | head -n 12 || true
              echo '~~~'
              echo "Full context remains in the GitHub Actions step log and test reports."
            fi
            echo "- Keystore: **$KEYSTORE_RESULT**"
            echo "- APK build: **$BUILD_RESULT**"
            echo "- APK checksum and certificate: **$IDENTITY_RESULT**"
            echo "- APK artifact upload: **$UPLOAD_RESULT**"
            echo ""
            if [ "$TEST_RESULT" != "success" ]; then
              echo "**Next action:** inspect the Run app unit tests log for Kotlin compilation or test failures. No APK is accepted."
            elif [ "$KEYSTORE_RESULT" = "failure" ]; then
              echo "**Next action:** investigate the signing keystore gate. Do not install a replacement-signed APK."
            elif [ "$BUILD_RESULT" = "failure" ]; then
              echo "**Next action:** inspect Build debug APK logs. No APK is accepted."
            elif [ "$IDENTITY_RESULT" = "failure" ] || [ "$UPLOAD_RESULT" = "failure" ]; then
              echo "**Next action:** investigate APK identity/artifact publication. Do not install an unverified APK."
            elif [ "$BUILD_RESULT" = "success" ] && [ "$IDENTITY_RESULT" = "success" ] && [ "$UPLOAD_RESULT" = "success" ]; then
              echo "**Next action:** use the Procurement-APK artifact for targeted Android Harness QA. Verify checksum and certificate before an in-place upgrade; preserve app data."
            else
              echo "**Next action:** review the workflow result and any skipped steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
