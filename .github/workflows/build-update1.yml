name: Build Update 1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, update2-trusted-rates, update2-rate-check, update2-ratecheck-refine, update2-find-rates, update2-rate-ingestion]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-update1.yml"

permissions:
  contents: read

concurrency:
  group: update1-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK and Gradle environment
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;36.1.0"

          sed -i '/^android\.sdk\.path=/d' gradle.properties
          sed -i '/^systemProp\.java\.library\.path=/d' gradle.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

          chmod +x gradlew

      - name: Verify signing keystore exists
        shell: bash
        run: |
          test -f keystore/debug.keystore
          keytool -list             -keystore keystore/debug.keystore             -storepass android             -alias androiddebugkey >/dev/null

      - name: Build debug APK
        shell: bash
        run: bash gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run app unit tests
        continue-on-error: true
        shell: bash
        run: bash gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Record APK checksums and signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p build-artifacts
          cp "$APK" build-artifacts/Procurement-Update1-debug.apk
          sha256sum "$APK" | tee build-artifacts/APK_SHA256.txt

          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner"
          fi
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee build-artifacts/APK_SIGNING_CERT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Procurement-Update1-APK
          path: |
            build-artifacts/Procurement-Update1-debug.apk
            build-artifacts/APK_SHA256.txt
            build-artifacts/APK_SIGNING_CERT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Procurement-Update1-Test-Reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
