android.useAndroidX=true
android.enableJetifier=true

# Memory headroom for Kotlin + Room annotation processing.
# The java.io.tmpdir default is set per-invocation in the build script rather
# than here, so this file stays machine-independent.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# Use the Linux toolchain's aapt2 (arm64) instead of the SDK's x86-64 binary
android.sdk.path=/storage/emulated/0/Android/data/com.androidharness.app/files/workspace/native/sdk

# Set library path for arm64 aapt2
systemProp.java.library.path=/data/local/tmp/androidharness/com.androidharness.app/linux/lib

# Override AGP's downloaded x86-64 aapt2 with the device's native arm64 aapt2
android.aapt2FromMavenOverride=/data/local/tmp/androidharness/com.androidharness.app/linux/tmp/aapt2bin/aapt2
